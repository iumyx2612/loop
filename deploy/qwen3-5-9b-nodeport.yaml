# NodePort for every replica of qwen3-5-9b-loop: kube-proxy balances requests over the pods
# (kubectl port-forward svc/... tunnels to ONE pod only). Access: http://<node-ip>:30980/v1
apiVersion: v1
kind: Service
metadata: {name: qwen3-5-9b-loop-np, namespace: llms-dev}
spec:
  type: NodePort
  selector: {app: qwen3-5-9b-loop}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30980}]
